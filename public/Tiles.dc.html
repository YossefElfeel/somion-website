<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="fonts/6a51d61393.css" rel="stylesheet">
<style>body{margin:0;background:#fbfbfe;font-family:'DM Sans',system-ui,sans-serif}a{color:#3435cc}a:hover{color:#4e4feb}</style>
</helmet>
<section data-screen-label="{{ label }}" style="max-width:1180px;margin:0 auto;padding:104px clamp(16px,4vw,40px) 0;color:#08133e;font-family:'DM Sans',system-ui,sans-serif">
  <div data-reveal="1" style="display:flex;flex-wrap:wrap;gap:20px 48px;align-items:flex-end;justify-content:space-between">
    <div style="flex:1 1 420px;display:flex;flex-direction:column;gap:12px;max-width:640px">
      <span style="font:800 12px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#4e4feb">{{ eyebrow }}</span>
      <h2 data-words="1" style="margin:0;font:800 clamp(32px,4.2vw,52px)/1.03 'Manrope',sans-serif;letter-spacing:-.03em;text-wrap:balance">{{ title }}</h2>
    </div>
    <p style="flex:1 1 300px;max-width:420px;margin:0;font-size:16.5px;line-height:1.6;color:#5d6480">{{ lead }}</p>
  </div>
  <sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}"><div style="{{ gridStyle }}">
    <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="4">
      <a href="{{ t.href }}" data-reveal="1" data-tilt="1" style="position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:16px;min-height:240px;padding:24px;border-radius:24px;background:#fff;border:1px solid #e5e7f2;box-shadow:0 1px 2px rgba(8,19,62,.03),0 22px 46px -38px rgba(8,19,62,.35);text-decoration:none;color:#08133e;transition:box-shadow .3s,border-color .3s" style-hover="border-color:#c7c9f9;box-shadow:0 1px 2px rgba(8,19,62,.03),0 36px 64px -36px rgba(78,79,235,.5);color:#08133e">
        <div data-glow="1" aria-hidden="true" style="position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;pointer-events:none"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span style="width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#7c7dff,#4e4feb 60%,#3b3cd4);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 14px 26px -14px rgba(78,79,235,.85)"><span style="{{ t.iconStyle }}"></span></span>
          <sc-if value="{{ t.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="padding:5px 10px;border-radius:999px;background:#e9f8ef;border:1px solid #c7e9d3;color:#146132;font:800 11px 'DM Sans',sans-serif;white-space:nowrap">{{ t.badge }}</span></sc-if>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px"><h3 style="margin:0;font:800 20px/1.2 'Manrope',sans-serif;letter-spacing:-.01em">{{ t.title }}</h3><p style="margin:0;font-size:14.5px;line-height:1.55;color:#5d6480">{{ t.text }}</p></div>
        <div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid #f0f1fb">
          <span style="font:700 14px 'DM Sans',sans-serif;color:#2f30a8">{{ t.from }}</span>
          <span style="width:36px;height:36px;border-radius:11px;background:#eeeefe;display:inline-flex;align-items:center;justify-content:center;flex:none"><span style="display:inline-block;width:16px;height:16px;background:#4e4feb;mask:url(assets/icons/arrow-right.svg) center/contain no-repeat;-webkit-mask:url(assets/icons/arrow-right.svg) center/contain no-repeat"></span></span>
        </div>
      </a>
    </sc-for>
  </div></sc-if>
  <sc-if value="{{ isAccordion }}" hint-placeholder-val="{{ false }}">
    <div data-reveal="1" style="{{ accWrapStyle }}">
      <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="5">
        <a href="{{ t.href }}" onMouseEnter="{{ t.activate }}" onFocus="{{ t.activate }}" aria-expanded="{{ t.open }}" style="{{ t.accStyle }}">
          <div aria-hidden="true" style="{{ t.accGlow }}"></div>
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
            <span style="width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#7c7dff,#4e4feb 60%,#3b3cd4);display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:0 14px 26px -14px rgba(78,79,235,.85)"><span style="{{ t.iconStyle }}"></span></span>
            <sc-if value="{{ t.showBadge }}" hint-placeholder-val="{{ false }}"><span style="padding:5px 10px;border-radius:999px;background:rgba(97,214,166,.14);border:1px solid rgba(97,214,166,.35);color:#c7f7e2;font:800 11px 'DM Sans',sans-serif;white-space:nowrap">{{ t.badge }}</span></sc-if>
            <sc-if value="{{ t.showPlus }}" hint-placeholder-val="{{ true }}"><span style="width:32px;height:32px;border-radius:10px;background:#f0f1fb;display:inline-flex;align-items:center;justify-content:center;flex:none"><span style="display:inline-block;width:15px;height:15px;flex:none;background:#5d6480;mask:url(assets/icons/plus.svg) center/contain no-repeat;-webkit-mask:url(assets/icons/plus.svg) center/contain no-repeat"></span></span></sc-if>
          </div>
          <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px;min-width:0">
            <h3 style="{{ t.accTitle }}">{{ t.title }}</h3>
            <div style="{{ t.accMore }}">
              <div style="overflow:hidden;min-height:0">
                <div style="display:flex;flex-direction:column;gap:14px;min-width:min(240px,100%);padding-top:2px">
                  <p style="{{ t.accText }}">{{ t.text }}</p>
                  <div style="{{ t.accFoot }}"><span style="{{ t.accFrom }}">{{ t.from }}</span><span style="{{ t.accChip }}"><span style="{{ t.accArrow }}"></span></span></div>
                </div>
              </div>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </sc-if>

</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:620},&quot;set&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;essentials&quot;,&quot;power&quot;],&quot;default&quot;:&quot;essentials&quot;,&quot;tsType&quot;:&quot;'essentials'|'power'&quot;}}">
class Component extends DCLogic {
  state = { mod: null, currency: 'USD', cols: 4, active: 0, wideAcc: true };
  componentDidMount() {
    this.onRs = () => { const w = window.innerWidth, n = this.props.set === 'power' ? 5 : 4; const cols = w >= 1120 ? n : w >= 640 ? (n === 5 ? 3 : 2) : 1; const wideAcc = w >= 1060; if (cols !== this.state.cols || wideAcc !== this.state.wideAcc) this.setState({ cols, wideAcc }); }; window.addEventListener('resize', this.onRs); this.onRs();
    import((window.__resources && window.__resources['./somion-data.js']) || './somion-data.js').then(mod => { this.setState({ mod, currency: mod.getCurrency() }); mod.revealOnScroll(document); });
    this.onCur = e => this.setState({ currency: e.detail }); window.addEventListener('somion:currency', this.onCur);
  }
  componentDidUpdate() { const m = this.state.mod; if (m) m.revealOnScroll(document); }
  componentWillUnmount() { window.removeEventListener('somion:currency', this.onCur); window.removeEventListener('resize', this.onRs); }
  renderVals() {
    const m = this.state.mod, cur = this.state.currency, set = this.props.set === 'power' ? 'power' : 'essentials';
    const f = v => m ? m.fmt(v, cur) : '$' + v.toFixed(2);
    const icon = n => ({ display: 'inline-block', width: 22, height: 22, background: '#fff', mask: 'url(assets/icons/' + n + '.svg) center/contain no-repeat', WebkitMask: 'url(assets/icons/' + n + '.svg) center/contain no-repeat' });
    const from = id => { if (!m) return ''; const c = m.categoryById(id); const min = Math.min(...c.plans.map(p => p.price)); return min === 0 ? 'Free plan available' : 'from ' + f(min) + '/mo'; };
    const blurb = id => m ? m.categoryById(id).blurb : '';
    const tiles = set === 'essentials' ? [
      ['server', 'Hosting', 'Fast, secure cPanel hosting with SSL, backups and support included.', from('shared'), 'Hosting.dc.html', ''],
      ['globe', 'Domains', 'Find and register the right name for your brand, with renewals shown upfront.', m ? 'from ' + f(Math.min(...m.TLDS.map(t => t.first))) + '/yr' : '', 'Domains.dc.html', ''],
      ['mail', 'Email hosting', blurb('email'), from('email'), 'Hosting.dc.html?cat=email', ''],
      ['rocket', 'Free website migration', 'We move your existing website, files and databases to Somion for you.', 'Included with every plan', 'Contact.dc.html', 'Free'],
    ] : [
      ['cpu', 'VPS Hosting', blurb('vps'), from('vps'), 'Hosting.dc.html?cat=vps', 'Root access'],
      ['cloud', 'Cloud Hosting', blurb('cloud'), from('cloud'), 'Hosting.dc.html?cat=cloud', ''],
      ['activity', 'Site & Server Monitoring', blurb('monitoring'), from('monitoring'), 'Hosting.dc.html?cat=monitoring', ''],
      ['shield-check', 'SSL Certificates', blurb('ssl'), from('ssl'), 'Hosting.dc.html?cat=ssl', ''],
      ['layout-grid', 'Website Builder', blurb('builder'), from('builder'), 'Hosting.dc.html?cat=builder', ''],
    ];
    const copy = set === 'essentials'
      ? ['Essentials tiles', 'The essentials', 'Everything you need to go online.', 'Hosting, a name, email, and a hand moving in. Start with what you need today and add the rest when you are ready.']
      : ['More power tiles', 'More power when you need it', 'Room to grow, without switching providers.', 'Dedicated resources, monitoring and certificates on the same account and the same bill.'];
    const acc = set === 'power', wide = this.state.wideAcc, EASE = 'cubic-bezier(.2,.7,.2,1)';
    const aIcon = (n, c, s) => ({ display: 'inline-block', width: s, height: s, background: c, mask: 'url(assets/icons/' + n + '.svg) center/contain no-repeat', WebkitMask: 'url(assets/icons/' + n + '.svg) center/contain no-repeat' });
    return { label: copy[0], eyebrow: copy[1], title: copy[2], lead: copy[3], isGrid: !acc, isAccordion: acc,
      accWrapStyle: { marginTop: 40, display: 'flex', flexDirection: wide ? 'row' : 'column', gap: 12, height: wide ? 360 : 'auto' },
      gridStyle: { marginTop: 40, display: 'grid', gridTemplateColumns: 'repeat(' + this.state.cols + ',minmax(0,1fr))', gap: 16 },
      tiles: tiles.map(([ic, title, text, fromLabel, href, badge], i) => { const open = !wide || i === this.state.active, dark = wide && open;
        return { iconStyle: icon(ic), title, text, from: fromLabel, href, badge, hasBadge: !!badge, open, showBadge: dark && !!badge, showPlus: wide && !open,
          activate: () => { if (this.state.active !== i) this.setState({ active: i }); },
          accStyle: { position: 'relative', overflow: 'hidden', isolation: 'isolate', display: 'flex', flexDirection: 'column', gap: 16, padding: wide ? 22 : 24, borderRadius: 26, textDecoration: 'none', minWidth: 0, boxSizing: 'border-box', flex: wide ? (open ? '2.3 1 0' : '1 1 0') : 'none', background: dark ? 'linear-gradient(160deg,#141e5e 0%,#07122f 78%)' : '#fff', border: '1px solid ' + (dark ? 'rgba(124,125,255,.4)' : '#e5e7f2'), boxShadow: dark ? '0 44px 80px -40px rgba(46,48,170,.75)' : '0 1px 2px rgba(8,19,62,.03), 0 20px 40px -36px rgba(8,19,62,.3)', color: dark ? '#fff' : '#08133e', cursor: 'pointer', transition: 'flex .65s ' + EASE + ', background .45s ease, box-shadow .45s ease, border-color .45s ease, color .45s ease' },
          accGlow: { position: 'absolute', right: -90, top: -110, width: 300, height: 300, borderRadius: '50%', background: 'radial-gradient(closest-side,rgba(124,125,255,.55),rgba(124,125,255,0))', opacity: dark ? 1 : 0, transition: 'opacity .5s ease', zIndex: -1, pointerEvents: 'none' },
          accTitle: { margin: 0, font: (open ? "800 clamp(20px,1.7vw,24px)/1.15" : "800 17px/1.2") + " 'Manrope', sans-serif", letterSpacing: '-.01em', color: 'inherit', hyphens: 'auto', transition: 'font-size .4s ease' },
          accMore: { display: 'grid', gridTemplateRows: open ? '1fr' : '0fr', opacity: open ? 1 : 0, transform: open ? 'none' : 'translateY(8px)', transition: 'grid-template-rows .6s ' + EASE + ', opacity .45s ease ' + (open ? '.12s' : '0s') + ', transform .6s ' + EASE },
          accText: { margin: 0, fontSize: 15, lineHeight: 1.55, color: dark ? 'rgba(255,255,255,.78)' : '#5d6480' },
          accFoot: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, paddingTop: 14, borderTop: '1px solid ' + (dark ? 'rgba(255,255,255,.14)' : '#f0f1fb') },
          accFrom: { font: "700 14px 'DM Sans', sans-serif", color: dark ? '#c7c9f9' : '#2f30a8', whiteSpace: 'nowrap' },
          accChip: { width: 38, height: 38, borderRadius: 12, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: 'none', background: dark ? '#fff' : '#eeeefe' },
          accArrow: aIcon('arrow-right', '#4e4feb', 16) }; }) };
  }
}
</script>
</body>
</html>
